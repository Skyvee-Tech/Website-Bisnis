<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Quote — Tan Malaka</title>
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  src: url("../assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
  font-weight: 200 800;
  font-display: block;
}
@font-face {
  font-family: "Playfair Display";
  src: url("PlayfairDisplay.ttf") format("truetype");
  font-weight: 400 900;
  font-display: block;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 1080px;
  height: 1620px;
  overflow: hidden;
  background: #f2eee3;
}
body {
  font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
  color: #141414;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.poster {
  position: relative;
  width: 1080px;
  height: 1620px;
  overflow: hidden;
  background: linear-gradient(180deg, #f6f2e8 0%, #efeade 100%);
}
.photo {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 53%;
  overflow: hidden;
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 52%;
  filter: saturate(.78) contrast(.96) brightness(1.02) sepia(.05);
}
.photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, #f3efe4 0%, rgba(243, 239, 228, .78) 12%, rgba(243, 239, 228, 0) 42%),
    linear-gradient(0deg, rgba(20, 20, 20, .10), transparent 45%);
}
.content {
  position: relative;
  z-index: 2;
  padding: 88px 84px 0;
}
h1 {
  margin: 0;
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 900;
  font-size: 108px;
  line-height: .94;
  letter-spacing: -.035em;
  color: #0e0e0e;
}
h1 sup {
  font-size: .46em;
  vertical-align: .52em;
  line-height: 0;
  letter-spacing: 0;
}
.quote {
  margin: 42px 0 0;
  max-width: 680px;
  font-size: 29px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -.01em;
  color: #222;
}
.by {
  margin: 22px 0 0;
  font-family: "Segoe Script", "Bradley Hand", "Brush Script MT", cursive;
  font-size: 35px;
  line-height: 1.1;
  color: #333;
}
.credit {
  position: absolute;
  z-index: 3;
  top: 104px;
  right: 26px;
  writing-mode: vertical-rl;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .22em;
  color: rgba(20, 20, 20, .35);
  text-transform: uppercase;
}
.github-card {
  position: absolute;
  z-index: 4;
  left: 84px;
  right: 84px;
  bottom: 66px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 24px;
  border-radius: 12px;
  background: rgba(247, 243, 233, .94);
  border: 1px solid rgba(20, 20, 20, .14);
  box-shadow: 0 18px 40px rgba(20, 20, 20, .14);
  backdrop-filter: blur(10px);
}
.github-card svg {
  width: 38px;
  height: 38px;
  flex: none;
  color: #141414;
}
.github-meta { flex: 1; }
.github-meta small {
  display: block;
  color: #555;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.github-meta strong {
  display: block;
  margin-top: 4px;
  color: #111;
  font-size: 23px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.github-arrow {
  color: #141414;
  font-size: 26px;
  line-height: 1;
}
</style>
</head>
<body>
<div class="poster">
  <div class="photo"><img src="quote-classroom.jpg" alt=""></div>
  <div class="credit">Skyvee Tech</div>
  <main class="content">
    <h1>Sekolah tinggi<sup>2</sup><br>mau jadi apa?</h1>
    <p class="quote">“Tujuan pendidikan itu untuk mempertajam kecerdasan, memperkukuh kemauan serta memperhalus perasaan.”</p>
    <p class="by">Tan Malaka</p>
  </main>
  <div class="github-card">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.35.78 1.05.78 2.12v3.14c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
    <div class="github-meta">
      <small>Follow GitHub</small>
      <strong>github.com/Skyvee-Tech</strong>
    </div>
    <span class="github-arrow">↗</span>
  </div>
</div>
</body>
</html>
